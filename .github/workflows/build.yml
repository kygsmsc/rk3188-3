name: 编译 RK3188 Linux 刷机包

on:
  workflow_dispatch: # 仅允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 检查仓库文件是否存在
        run: |
          echo "当前工作目录: $(pwd)"
          ls -la
          if [ ! -f "configs/3188_defconfig" ]; then
            echo "错误: 找不到 configs/3188_defconfig 文件。"
            exit 1
          fi
          if [ ! -f "dts/rk3188-adesk.dts" ]; then
            echo "错误: 找不到 dts/rk3188-adesk.dts 文件。"
            exit 1
          fi
          echo "文件检查通过。"

      - name: 安装宿主机编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libncurses-dev \
            bc kmod rsync wget xz-utils git \
            gcc-arm-linux-gnueabihf \
            qemu-user-static \
            device-tree-compiler \
            libncurses5

      - name: 下载并解压 Linux 6.12 内核源码
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.117.tar.xz
          tar -xvf linux-6.12.117.tar.xz
          cp "${GITHUB_WORKSPACE}/configs/3188_defconfig" linux-6.12.117/arch/arm/configs/
          echo "内核源码解压并配置完毕。"

      - name: 集成自定义 DTS 并修改 Makefile
        run: |
          cd linux-6.12.117
          cp "${GITHUB_WORKSPACE}/dts/rk3188-adesk.dts" arch/arm/boot/dts/rockchip/
          if ! grep -q "rk3188-adesk.dtb" arch/arm/boot/dts/rockchip/Makefile; then
              echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-adesk.dtb" >> arch/arm/boot/dts/rockchip/Makefile
          fi
          echo "自定义 DTS 已集成。"

      - name: 配置内核
        run: |
          cd linux-6.12.117
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make 3188_defconfig
          # 不需要 blkdevparts，保持标准块设备解析
          scripts/config --disable BLK_CMDLINE_PARSER || true
          scripts/config --disable CMDLINE_PARTITION || true
          echo "内核配置完成。"

      - name: 编译内核、设备树与模块
        run: |
          cd linux-6.12.117
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) zImage modules dtbs
          echo "内核编译完成。"

      - name: 编译 rockchip-mkbootimg 工具
        run: |
          git clone https://github.com/neo-technologies/rockchip-mkbootimg.git
          cd rockchip-mkbootimg
          make
          echo "mkbootimg 工具编译完成。"

      - name: 合并内核与 DTB 并生成 boot.img
        run: |
          mkdir -p output
          cat linux-6.12.117/arch/arm/boot/zImage \
              linux-6.12.117/arch/arm/boot/dts/rockchip/rk3188-adesk.dtb \
              > output/kernel-dtb
          # 不传入自定义 cmdline，启动参数由 parameter.txt 提供
          ./rockchip-mkbootimg/mkbootimg --kernel output/kernel-dtb -o output/boot.img
          ls -lh output/boot.img

      - name: 下载并准备 Ubuntu Base 根文件系统
        run: |
          wget https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04.5-base-armhf.tar.gz
          truncate -s 2G output/rootfs.img
          mkfs.ext4 -F output/rootfs.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop output/rootfs.img /mnt/rootfs
          sudo tar -xpf ubuntu-base-22.04.5-base-armhf.tar.gz -C /mnt/rootfs
          echo "根文件系统解压完成。"

      - name: 进入 chroot 配置根文件系统
        run: |
          sudo cp /usr/bin/qemu-arm-static /mnt/rootfs/usr/bin/
          sudo mount --bind /dev /mnt/rootfs/dev
          sudo mount --bind /proc /mnt/rootfs/proc
          sudo mount --bind /sys /mnt/rootfs/sys
          echo "nameserver 8.8.8.8" | sudo tee /mnt/rootfs/etc/resolv.conf
          sudo chroot /mnt/rootfs /bin/bash -c "
            echo 'root:root' | chpasswd
            apt-get update
            apt-get install -y systemd-sysv openssh-server
            ls -l /sbin/init
            sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
            sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
            apt-get clean
          "
          echo "根文件系统配置完成。"

      - name: 安装内核模块到根文件系统
        run: |
          cd linux-6.12.117
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          sudo make INSTALL_MOD_PATH=/mnt/rootfs modules_install
          ls /mnt/rootfs/lib/modules/ || true

      - name: 同步并卸载根文件系统镜像
        run: |
          sync
          sudo umount /mnt/rootfs/dev || true
          sudo umount /mnt/rootfs/proc || true
          sudo umount /mnt/rootfs/sys || true
          sudo umount /mnt/rootfs
          ls -lh output/

      - name: 上传刷机包产物
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-adesk-firmware
          path: |
            output/boot.img
            output/rootfs.img
            parameter.txt
