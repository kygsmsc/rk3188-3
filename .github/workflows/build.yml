name: 编译 RK3188 Linux 刷机包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 检查仓库文件
        run: |
          if [ ! -f "configs/3188_defconfig" ]; then echo "错误: 缺 configs/3188_defconfig"; exit 1; fi
          if [ ! -f "dts/rk3188-adesk.dts" ]; then echo "错误: 缺 dts/rk3188-adesk.dts"; exit 1; fi
          echo "文件检查通过。"

      - name: 安装宿主机依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libncurses-dev \
            bc kmod rsync wget xz-utils git gcc-arm-linux-gnueabihf qemu-user-static \
            device-tree-compiler libncurses5

      - name: 下载内核并集成配置与 DTS
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.117.tar.xz
          tar -xvf linux-6.12.117.tar.xz
          cp configs/3188_defconfig linux-6.12.117/arch/arm/configs/
          cp dts/rk3188-adesk.dts linux-6.12.117/arch/arm/boot/dts/rockchip/
          echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3188-adesk.dtb" >> linux-6.12.117/arch/arm/boot/dts/rockchip/Makefile

      - name: 编译内核、设备树与模块
        run: |
          cd linux-6.12.117
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make 3188_defconfig
          make -j$(nproc) zImage modules dtbs

      - name: 编译 rockchip-mkbootimg 并生成 boot.img
        run: |
          git clone https://github.com/neo-technologies/rockchip-mkbootimg.git
          cd rockchip-mkbootimg && make && cd ..
          mkdir -p output
          cat linux-6.12.117/arch/arm/boot/zImage \
              linux-6.12.117/arch/arm/boot/dts/rockchip/rk3188-adesk.dtb \
              > output/kernel-dtb
          ./rockchip-mkbootimg/mkbootimg --kernel output/kernel-dtb -o output/boot.img
          ls -lh output/boot.img

      - name: 下载 Ubuntu Base 根文件系统
        run: |
          wget https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04.5-base-armhf.tar.gz
          truncate -s 2G output/rootfs.img
          mkfs.ext4 -F output/rootfs.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop output/rootfs.img /mnt/rootfs
          sudo tar -xpf ubuntu-base-22.04.5-base-armhf.tar.gz -C /mnt/rootfs

      - name: 进入 chroot 配置根文件系统
        run: |
          sudo cp /usr/bin/qemu-arm-static /mnt/rootfs/usr/bin/
          sudo mount --bind /dev /mnt/rootfs/dev
          sudo mount --bind /proc /mnt/rootfs/proc
          sudo mount --bind /sys /mnt/rootfs/sys
          echo "nameserver 8.8.8.8" | sudo tee /mnt/rootfs/etc/resolv.conf
          sudo chroot /mnt/rootfs /bin/bash -c "
            echo 'root:root' | chpasswd
            apt-get update && apt-get install -y systemd-sysv openssh-server
            sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
            apt-get clean
          "

      - name: 安装内核模块到根文件系统
        run: |
          cd linux-6.12.117
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          sudo make INSTALL_MOD_PATH=/mnt/rootfs modules_install

      - name: 卸载并上传产物
        run: |
          sync
          sudo umount /mnt/rootfs/dev /mnt/rootfs/proc /mnt/rootfs/sys /mnt/rootfs || true
          ls -lh output/

      - name: 上传刷机包产物
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-adesk-firmware
          path: |
            output/boot.img
            output/rootfs.img
            parameter.txt
